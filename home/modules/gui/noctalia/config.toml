[audio]
enable_overdrive = true

[bar.default]
center = [ "clock", "weather" ]
concave_edge_corners = false
end = [
    "network_rx",
    "network_tx",
    "ram",
    "cpu",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "Maple Mono Normal NL NF Medium"
font_weight = 700
margin_ends = 0
position = "bottom"
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "media", "audio_visualizer" ]
widget_spacing = 16

[control_center.calendar]
show_week_numbers = true

[location]
address = "Norrköping"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-5" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 2378.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-5"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-5".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
position = "top_center"

[shell]
# TODO: Declaratively download and set avatar
# avatar_path = "profile-picture.png"
clipboard_enabled = false

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "wallpaper"

[wallpaper.default]
# TODO: Declaratively download and set wallpaper
# path = "wallpaper.png"

[wallpaper.last]
# TODO: Declaratively download and set wallpaper
# path = "wallpaper.png"

[widget.control-center]
enabled = true

[widget.wallpaper]
enabled = false
