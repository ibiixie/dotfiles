[audio]
enable_overdrive = true

[bar]
order = [ "default" ]

    [bar.default]
    center = [ "weather", "date", "clock" ]
    concave_edge_corners = false
    end = [
        "tray",
        "clipboard",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "network",
        "notifications",
        "control-center",
        "session"
    ]
    font_family = "Maple Mono Normal NL NF Medium"
    font_weight = 700
    margin_ends = 0
    position = "bottom"
    radius = 0
    start = [ "launcher", "wallpaper", "workspaces", "media", "audio_visualizer" ]
    widget_spacing = 16

        [bar.default.monitor.DP-2]
        center = [ "weather", "date", "clock" ]
        enabled = true
        end = [ "tray", "notifications" ]
        start = [ "workspaces" ]

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "media"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Norrköping"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-5" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 2378.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-5"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-5".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
position = "top_right"

[osd.kinds]
lock_keys = false
media = false

[shell]
clipboard_enabled = false

[system.monitor]
enabled = false

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

[widget.clock]
format = "{:%H:%M:%S %Z}"

[widget.control-center]
enabled = true

[widget.wallpaper]
enabled = false
